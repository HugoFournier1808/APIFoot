info:
  name: 1. Créer une équipe
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8085/api/equipes
  body:
    type: json
    data: |-
      {
        "nom": "Real Madrid",
        "ville": "Madrid"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
